#:schema node_modules/wrangler/config-schema.json
name = "fit2bsky-cw"
main = "src/index.ts"
compatibility_date = "2024-07-18"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "FIT2BSKY_KV"
id = "6b63fe49f27f429da0e7836a07fc73e3"
preview_id = "63bfdea453d0471ca546f84865d574e8"

[vars]
TARGET_WEIGHT = "120.0"
# BMI の計算に使う身長（cm）。Google Health API には BMI のデータ型が無い
HEIGHT_CM = "186.5"

[triggers]
crons = ["0 0 * * *", "0 3 * * *", "0 12 * * *"]